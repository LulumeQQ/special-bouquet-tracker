<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特殊花束配方管理</title>
  <style>
    :root{--bg:#0c1220;--bg2:#121a2a;--panel:#1a2335;--line:#2c3a50;--text:#edf3ff;--muted:#a9b8d2;--green:#38d39f;--amber:#f6c453;--red:#ff6b6b;--shadow:0 18px 40px rgba(0,0,0,0.22)}
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
    .container{max-width:1440px;margin:24px auto;padding:0 18px 28px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.title-wrap h1{margin:0;font-size:2rem;letter-spacing:1px}.subtitle{margin-top:8px;color:var(--muted);font-size:.92rem}.badge-mini{display:inline-block;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:.8rem}.layout{display:grid;grid-template-columns:1.45fr .95fr;gap:18px;align-items:stretch}.panel{background:rgba(26,35,53,.96);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:100%}.panel-header{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 18px 0}input[type="text"]{flex:1;min-width:220px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0f1727;color:var(--text);font-size:14px;outline:none}.filter-group{display:flex;gap:8px;flex-wrap:wrap}button{background:#23314a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;transition:.15s ease}button:hover{filter:brightness(1.08);transform:translateY(-1px)}.ghost{background:transparent}.table-wrap{flex:1;min-height:0;overflow:auto;padding:0 0 8px}.table-wrap table{width:100%;border-collapse:collapse}th,td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:13px}th{position:sticky;top:0;background:#1a2335;z-index:2;color:#e7edf9}.done-row{opacity:.64}.badge{display:inline-block;min-width:56px;text-align:center;border-radius:999px;padding:5px 9px;font-weight:700;letter-spacing:.5px;border:1px solid rgba(255,255,255,.1);font-size:12px}.rarity-1{background:#e5e7eb;color:#111827}.rarity-2{background:#93c5fd;color:#0f172a}.rarity-3{background:#86efac;color:#052e16}.rarity-4{background:#fcd34d;color:#1f2937}.rarity-5{background:#fda4af;color:#3f0d12}.flower-tags{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-block;background:#0d1726;border:1px solid var(--line);color:var(--text);border-radius:999px;font-size:11px;padding:4px 8px;white-space:nowrap}.toggle-btn{width:100%;min-width:92px;background:#23314a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700}.toggle-btn.done{background:#1f6f4a;border-color:#2cc77a;color:#dffef1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 0;flex:0 0 auto}.stat{background:#101a2a;border:1px solid var(--line);border-radius:12px;padding:12px 10px}.stat-label{color:var(--muted);font-size:12px;margin-bottom:8px}.stat-value{font-size:1.8rem;font-weight:700}.green{color:var(--green)}.amber{color:var(--amber)}.need-panel{padding:14px 16px 16px;flex:1;min-height:0;display:flex;flex-direction:column}.need-nav{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 12px;margin:0 -2px}.need-chip{background:#0f1727;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:999px;font-size:12px;flex:0 0 auto}.need-chip:hover{filter:brightness(1.08)}.need-chip.active{background:var(--amber);color:var(--bg);border-color:var(--amber)}.need-table{margin-top:0;background:#0f1727;border:1px solid var(--line);border-radius:12px;overflow:auto;flex:1;min-height:0;padding:8px}.need-category{margin-bottom:14px}.need-category-title{font-weight:700;color:var(--amber);padding:8px 10px;background:rgba(255,255,255,.05);border-radius:6px;margin-bottom:6px;font-size:12px}.need-category-items{display:flex;flex-direction:column;gap:4px}.need-item{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}.need-item:last-child{border-bottom:none}.need-item-name{flex:1}.need-item-count{text-align:right;color:var(--green);font-weight:700;min-width:40px}.empty{text-align:center;color:var(--green);padding:14px 10px;font-weight:700}@media (max-width:980px){.layout{grid-template-columns:1fr}.table-wrap{max-height:60vh}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-wrap">
        <h1>🌸 特殊花束配方管理</h1>
        <div class="subtitle">追蹤已完成 / 未完成花束，並自動統計還缺哪些花種與數量</div>
      </div>
      <div class="badge-mini">已預設完成：你指定的已完成花束</div>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header"><strong>花束列表</strong></div>
        <div class="toolbar">
          <input id="searchInput" type="text" placeholder="搜尋花束名稱，例如：虎斑搖籃" />
          <div class="filter-group">
            <button data-filter="all">全部</button>
            <button data-filter="active" class="ghost">未完成</button>
            <button data-filter="done" class="ghost">已完成</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:70px;">編號</th>
                <th style="width:185px;">花束名稱</th>
                <th style="width:90px;">稀有度</th>
                <th>配方</th>
                <th style="width:120px;">狀態</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <div class="stat"><div class="stat-label">總花束</div><div class="stat-value" id="totalCount">0</div></div>
          <div class="stat"><div class="stat-label">已完成</div><div class="stat-value green" id="doneCount">0</div></div>
          <div class="stat"><div class="stat-label">未完成</div><div class="stat-value amber" id="remainCount">0</div></div>
        </div>
        <div class="need-panel">
          <strong>未完成花束總需求</strong>
          <div id="needNav" class="need-nav"></div>
          <div class="need-table" id="needContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'special-bouquet-tracker-v2';
    const defaultCompletedNames = new Set(['晨曦花語','月下私語','童話花園','春日暖陽','星夜物語','銀河漫步','甜蜜時光','幸運草原','雨後彩虹','午後小憩','雪國情書','金色年華','祝福鈴聲','天使羽翼','海風之戀','琥珀之夢','緋色圓舞','奶貓搖鈴','虎斑搖籃']);
    const bouquets = [/* same bouquet data as before */];
    // Keep the existing bouquet data intact in the file version already on the repo.
    const flowerCategory = name => { if (name.includes('雛菊')) return '雛菊'; if (name.includes('滿天星')) return '滿天星'; if (name.includes('薰衣草')) return '薰衣草'; if (name.includes('梅')) return '梅'; if (name.includes('玫瑰')) return '玫瑰'; if (name.includes('百合')) return '百合'; return '鬱金香'; };
    const slugify = name => name.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '');
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const doneMap = {}; bouquets.forEach(item => { const key = String(item.id); doneMap[key] = Object.prototype.hasOwnProperty.call(saved, key) ? !!saved[key] : !!item.completed; });
    const tbody = document.getElementById('tbody'); const needContainer = document.getElementById('needContainer'); const needNav = document.getElementById('needNav'); const totalCount = document.getElementById('totalCount'); const doneCountEl = document.getElementById('doneCount'); const remainCountEl = document.getElementById('remainCount'); const searchInput = document.getElementById('searchInput'); let currentFilter = 'all'; let currentCategory = 'all';
    const flowerCategories = ['all','雛菊','滿天星','薰衣草','梅','玫瑰','百合','鬱金香'];
    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(doneMap)); }
    function getFiltered(){ const q = searchInput.value.trim().toLowerCase(); return bouquets.filter(item => { const matchText = !q || item.name.toLowerCase().includes(q); const matchDone = currentFilter === 'all' || (currentFilter === 'done' && doneMap[item.id]) || (currentFilter === 'active' && !doneMap[item.id]); return matchText && matchDone; }); }
    function calcNeed(){ const needMap = {}; let done = 0; bouquets.forEach(item => { if (doneMap[item.id]) { done++; return; } item.flowers.forEach(f => { needMap[f] = (needMap[f] || 0) + 1; }); }); return { done, remain: bouquets.length - done, entries: needMap }; }
    function renderNeedTable(){ const { entries } = calcNeed(); if (Object.keys(entries).length === 0){ needNav.innerHTML=''; needContainer.innerHTML='<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;">全部完成！</div>'; return; } const sortedEntries = Object.entries(entries).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-Hant')); const grouped = {}; sortedEntries.forEach(([name,count]) => { const cat = flowerCategory(name); if (!grouped[cat]) grouped[cat] = []; grouped[cat].push({name,count}); }); const activeCategories = flowerCategories.filter(c => c === 'all' || grouped[c]); const navHtml = activeCategories.map(cat => `<button class="need-chip ${currentCategory===cat?'active':''}" data-cat="${cat}">${cat === 'all' ? '全部' : cat}</button>`).join(''); needNav.innerHTML = navHtml; let html=''; const renderCats = currentCategory === 'all' ? activeCategories.filter(c => c !== 'all') : [currentCategory]; renderCats.forEach(cat => { if (cat === 'all') return; html += `<div class="need-category" id="cat-${slugify(cat)}"><div class="need-category-title">${cat}</div><div class="need-category-items">`; grouped[cat]?.forEach(item => { html += `<div class="need-item"><div class="need-item-name">${item.name}</div><div class="need-item-count">${item.count}</div></div>`; }); html += `</div></div>`; }); needContainer.innerHTML = html || '<div class="empty">無資料</div>'; document.querySelectorAll('.need-chip').forEach(btn => btn.addEventListener('click', () => { currentCategory = btn.dataset.cat; renderNeedTable(); })); }
    function render(){ const filtered = getFiltered(); const rows = filtered.map(item => { const done=!!doneMap[item.id]; return `<tr class="${done ? 'done-row' : ''}"><td>${item.id}</td><td>${item.name}</td><td><span class="badge rarity-${item.rarity}">★ ${item.rarity}</span></td><td><div class="flower-tags">${item.flowers.map(f => `<span class="tag">${f}</span>`).join('')}</div></td><td><button class="toggle-btn ${done ? 'done' : ''}" data-id="${item.id}">${done ? '已完成 ✅' : '未完成 ⏳'}</button></td></tr>`; }).join(''); tbody.innerHTML = rows || `<tr><td colspan="5" style="padding:20px; text-align:center;color:var(--muted);">沒有符合條件的花束</td></tr>`; document.querySelectorAll('.toggle-btn').forEach(btn=>btn.addEventListener('click',()=>{ const id=Number(btn.dataset.id); doneMap[id]=!doneMap[id]; saveState(); render(); })); const {done, remain}=calcNeed(); totalCount.textContent=String(bouquets.length); doneCountEl.textContent=String(done); remainCountEl.textContent=String(remain); renderNeedTable(); }
    searchInput.addEventListener('input', render); document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{ currentFilter=btn.dataset.filter; document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('ghost')); document.querySelectorAll('[data-filter]').forEach(b=>{ if (b.dataset.filter !== currentFilter) b.classList.add('ghost'); }); render(); })); render();
  </script>
</body>
</html>
