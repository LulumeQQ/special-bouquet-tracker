-3{background:#86efac;color:#052e16}.rarity-4{background:#fcd34d;color:#1f2937}.rarity-5{background:#fda4af;color:#3f0d12}.flower-tags{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-block;background:#0d1726;border:1px solid var(--line);color:var(--text);border-radius:999px;font-size:11px;padding:4px 8px;white-space:nowrap}.toggle-btn{width:100%;min-width:92px;background:#23314a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700}.toggle-btn.done{background:#1f6f4a;border-color:#2cc77a;color:#dffef1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 0;flex:0 0 auto}.stat{background:#101a2a;border:1px solid var(--line);border-radius:12px;padding:12px 10px}.stat-label{color:var(--muted);font-size:12px;margin-bottom:8px}.stat-value{font-size:1.8rem;font-weight:700}.green{color:var(--green)}.amber{color:var(--amber)}.need-panel{padding:14px 16px 16px;flex:1;min-height:0;display:flex;flex-direction:column}.need-nav{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 12px;margin:0 -2px}.need-chip{background:#0f1727;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:999px;font-size:12px;flex:0 0 auto}.need-chip:hover{filter:brightness(1.08)}.need-chip.active{background:var(--amber);color:var(--bg);border-color:var(--amber)}.need-table{margin-top:0;background:#0f1727;border:1px solid var(--line);border-radius:12px;overflow:auto;flex:1;min-height:0;padding:8px}.need-category{margin-bottom:14px}.need-category-title{font-weight:700;color:var(--amber);padding:8px 10px;background:rgba(255,255,255,.05);border-radius:6px;margin-bottom:6px;font-size:12px}.need-category-items{display:flex;flex-direction:column;gap:4px}.need-item{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}.need-item:last-child{border-bottom:none}.need-item-name{flex:1}.need-item-count{text-align:right;color:var(--green);font-weigh <body>
  <div class="container">
    <div class="header">
      <div class="title-wrap">
        <h1>🌸 特殊花束配方管理</h1>
        <div class="subtitle">追蹤已完成 / 未完成花束，並自動統計還缺哪些花種與數量</div>
      </div>
      <div class="badge-mini">已預設完成：你指定的已完成花束</div>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header"><strong>花束列表</strong></div>
        <div class="toolbar">
          <input id="searchInput" type="text" placeholder="搜尋花束名稱，例如：虎斑搖籃" />
          <div class="filter-group">
            <button data-filter="all">全部</button>
            <button data-filter="active" class="ghost">未完成</button>
            <button data-filter="done" class="ghost">已完成</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:70px;">編號</th>
                <th style="width:185px;">花束名稱</th>
                <th style="width:90px;">稀有度</th>
                <th>配方</th>
                <th style="width:120px;">狀態</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <div class="stat"><div class="stat-label">總花束</div><div class="stat-value" id="totalCount">0</div></div>
          <div class="stat"><div class="stat-label">已完成</div><div class="stat-value green" id="doneCount">0</div></div>
          <div class="stat"><div class="stat-label">未完成</div><div class="stat-value amber" id="remainCount">0</div></div>
        </div>
        <div class="need-panel">
          <strong>未完成花束總需求</strong>
          <div id="needNav" class="need-nav"></div>
          <div class="need-table" id="needContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'special-bouquet-tracker-v2';
    const defaultCompletedNames = new Set([

    ]);

    const bouquets = [

      { id: 18, name: '耀雀盛宴', rarity: 5, count: 3, flowers: ['黃雛菊','雙色星斑滿天星','彩虹幻境玫瑰'] },
      { id: 19, name: '呼嚕小調', rarity: 4, count: 3, flowers: ['白雛菊','曜夜極黑薰衣草','黑魔術玫瑰'] },

      { id: 21, name: '雨後彩虹', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅'] },
      { id: 22, name: '午後小憩', rarity: 1, count: 4, flowers: ['白雛菊','白滿天星','白雪薰衣草','綠萼梅'] },
      { id: 23, name: '雪國情書', rarity: 1, count: 4, flowers: ['白雛菊','白滿天星','白雪薰衣草','香檳玫瑰'] },
      { id: 24, name: '晚霞絮語', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','杏桃黃薰衣草','宮粉梅'] },
      { id: 25, name: '糖霜蛋糕', rarity: 2, count: 4, flowers: ['白雛菊','淡粉滿天星','白雪薰衣草','黑魔術玫瑰'] },
      { id: 26, name: '薩孔星空', rarity: 3, count: 4, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','璀璨極光百合'] },
      { id: 27, name: '金色年華', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','微光粉薰衣草','朱砂梅'] },
      { id: 28, name: '紫醉花香', rarity: 1, count: 4, flowers: ['白雛菊','淺藍滿天星','原生淺紫薰衣草','玉蝶梅'] },
      { id: 29, name: '祝福鈴聲', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','甜蜜藍薰衣草','橙黃玫瑰'] },

      { id: 32, name: '蜜糖派對', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','雙色斑紋薰衣草','香檳玫瑰'] },
      { id: 33, name: '奶油雲朵', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','杏桃黃薰衣草','玉蝶梅'] },
      { id: 34, name: '肉墊印記', rarity: 3, count: 4, flowers: ['白雛菊','胭脂紅滿天星','原生淺紫薰衣草','黑魔術玫瑰'] },
      { id: 35, name: '慵懶午後', rarity: 3, count: 4, flowers: ['黃雛菊','白滿天星','英倫深紫薰衣草','璀璨極光百合'] },

      { id: 38, name: '緋色圓舞', rarity: 1, count: 5, flowers: ['白雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅','香水姬百合'] },
      { id: 39, name: '奶貓搖鈴', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','白雪薰衣草','白梅','橙黃玫瑰'] },
      { id: 40, name: '虎斑搖籃', rarity: 2, count: 5, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','紫葉紅梅','紅玫瑰'] },
      { id: 41, name: '蝴蝶結禮讚', rarity: 2, count: 5, flowers: ['白雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅','皇家金絲墨鬱金香'] },
      { id: 42, name: '青空之詩', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','甜蜜藍薰衣草','白梅','粉紅玫瑰'] },
      { id: 43, name: '玫瑰騎士', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','灑金梅','粉紅玫瑰'] },
      { id: 44, name: '闖蕩飯匠', rarity: 1, count: 5, flowers: ['黃雛菊','白滿天星','原生淺紫薰衣草','綠萼梅','虎斑雙色百合'] },
      { id: 45, name: '毛球慶典', rarity: 2, count: 5, flowers: ['白雛菊','白滿天星','微光粉薰衣草','白梅','幽藍幻影百合'] },
      { id: 46, name: '路路節奏', rarity: 3, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','琥珀冰晶梅','粉紅玫瑰'] },
      { id: 47, name: '寶石盒子', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','灑金梅','香檳金百合'] },
      { id: 48, name: '窗台日光浴', rarity: 1, count: 5, flowers: ['黃雛菊','白滿天星','英倫深紫薰衣草','白梅','橙黃玫瑰'] },
      { id: 49, name: '尾巴圓舞曲', rarity: 2, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','紫葉紅梅','紫玫瑰'] },
      { id: 50, name: '貓草花田', rarity: 3, count: 5, flowers: ['黃雛菊','白滿天星','原生淺紫薰衣草','玉蝶梅','皇家金絲墨鬱金香'] }
    ].map(item => ({ ...item, completed: defaultCompletedNames.has(item.name) }));

    const flowerCategory = name => {
      if (name.includes('雛菊')) return '雛菊';
      if (name.includes('滿天星')) return '滿天星';
      if (name.includes('薰衣草')) return '薰衣草';
      if (name.includes('梅')) return '梅';
      if (name.includes('玫瑰')) return '玫瑰';
      if (name.includes('百合')) return '百合';
      return '鬱金香';
    };

    const slugify = name => name.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '');

    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const doneMap = {};
    bouquets.forEach(item => {
      const key = String(item.id);
      doneMap[key] = Object.prototype.hasOwnProperty.call(saved, key) ? !!saved[key] : !!item.completed;
    });

    const tbody = document.getElementById('tbody');
    const needContainer = document.getElementById('needContainer');
    const needNav = document.getElementById('needNav');
    const totalCount = document.getElementById('totalCount');
    const doneCountEl = document.getElementById('doneCount');
    const remainCountEl = document.getElementById('remainCount');
    const searchInput = document.getElementById('searchInput');
    let currentFilter = 'all';
    let currentCategory = 'all';

    const flowerCategories = ['all', '雛菊', '滿天星', '薰衣草', '梅', '玫瑰', '百合', '鬱金香'];

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(doneMap)); }
    function getFiltered() { const q = searchInput.value.trim().toLowerCase(); return bouquets.filter(item => { const matchText = !q || item.name.toLowerCase().includes(q); const matchDone = currentFilter === 'all' || (currentFilter === 'done' && doneMap[item.id]) || (currentFilter === 'active' && !doneMap[item.id]); return matchText && matchDone; }); }
    function calcNeed() { const needMap = {}; let done = 0; bouquets.forEach(item => { if (doneMap[item.id]) { done++; return; } item.flowers.forEach(f => { needMap[f] = (needMap[f] || 0) + 1; }); }); return { done, remain: bouquets.length - done, entries: needMap }; }

    function renderNeedTable() {
      const { entries } = calcNeed();
      if (Object.keys(entries).length === 0) {
        needNav.innerHTML = '';
        needContainer.innerHTML = '<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;">全部完成！</div>';
        return;
      }

      const grouped = {};
      Object.entries(entries).forEach(([name, count]) => {
        const cat = flowerCategory(name);
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push({ name, count });
      });

      const navEntries = flowerCategories.filter(cat => cat === 'all' || grouped[cat]);
      const navHtml = navEntries.map(cat => `<button class="need-chip ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat === 'all' ? '全部' : cat}</button>`).join('');
      needNav.innerHTML = navHtml;

      const renderCats = currentCategory === 'all' ? navEntries.filter(cat => cat !== 'all') : [currentCategory];
      let html = '';
      renderCats.forEach(cat => {
        html += `<div class="need-category" id="cat-${slugify(cat)}"><div class="need-category-title">${cat}</div><div class="need-category-items">`;
        grouped[cat].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-Hant')).forEach(item => {
          html += `<div class="need-item"><div class="need-item-name">${item.name}</div><div class="need-item-count">${item.count}</div></div>`;
        });
        html += `</div></div>`;
      });

      needContainer.innerHTML = html || '<div class="empty">無資料</div>';

      document.querySelectorAll('.need-chip').forEach(button => {
        button.addEventListener('click', () => {
          currentCategory = button.dataset.cat;
          renderNeedTable();
        });
      });
    }

    function render() {
      const filtered = getFiltered();
      const rows = filtered.map(item => {
        const done = !!doneMap[item.id];
        return `<tr class="${done ? 'done-row' : ''}">
          <td data-label="編號">${item.id}</td>
          <td data-label="花束名稱">${item.name}</td>
          <td data-label="稀有度"><span class="badge rarity-${item.rarity}">★ ${item.rarity}</span></td>
          <td data-label="配方"><div class="flower-tags">${item.flowers.map(f => `<span class="tag">${f}</span>`).join('')}</div></td>
          <td data-label="狀態"><button class="toggle-btn ${done ? 'done' : ''}" data-id="${item.id}">${done ? '完成' : '未完'}</button></td>
        </tr>`;
      }).join('');

      tbody.innerHTML = rows || `<tr><td colspan="5" style="padding:20px; text-align:center;color:var(--muted);">沒有符合條件的花束</td></tr>`;

      document.querySelectorAll('.toggle-btn').forEach(button => {
        button.addEventListener('click', () => {
          const id = Number(button.dataset.id);
          doneMap[id] = !doneMap[id];
          saveState();
          render();
        });
      });

      const { done, remain } = calcNeed();
      totalCount.textContent = String(bouquets.length);
      doneCountEl.textContent = String(done);
      remainCountEl.textContent = String(remain);
      renderNeedTable();
    }

    searchInput.addEventListener('input', render);
    document.querySelectorAll('[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('ghost'));
        document.querySelectorAll('[data-filter]').forEach(b => {
          if (b.dataset.filter !== currentFilter) b.classList.add('ghost');
        });
        render();
      });
    });

    render();
  </script>
</body>
</html>
