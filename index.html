<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特殊花束配方管理</title>
  <style>
    :root{--bg:#0c1220;--bg2:#121a2a;--panel:#1a2335;--line:#2c3a50;--text:#edf3ff;--muted:#a9b8d2;--green:#38d39f;--amber:#f6c453;--red:#ff6b6b;--shadow:0 18px 40px rgba(0,0,0,0.22)}
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
    .container{max-width:1440px;margin:24px auto;padding:0 18px 28px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.title-wrap h1{margin:0;font-size:2rem;letter-spacing:1px}.subtitle{margin-top:8px;color:var(--muted);font-size:.92rem}.badge-mini{display:inline-block;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:.8rem}.layout{display:grid;grid-template-columns:1.45fr .95fr;gap:18px}.panel{background:rgba(26,35,53,.96);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panel-header{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 18px 0}input[type="text"]{flex:1;min-width:220px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0f1727;color:var(--text);font-size:14px;outline:none}.filter-group{display:flex;gap:8px;flex-wrap:wrap}button{background:#23314a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;transition:.15s ease}button:hover{filter:brightness(1.08);transform:translateY(-1px)}.ghost{background:transparent}.table-wrap{max-height:75vh;overflow:auto;padding:0 0 8px}table{width:100%;border-collapse:collapse}th,td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:13px}th{position:sticky;top:0;background:#1a2335;z-index:2;color:#e7edf9}.done-row{opacity:.64}.badge{display:inline-block;min-width:56px;text-align:center;border-radius:999px;padding:5px 9px;font-weight:700;letter-spacing:.5px;border:1px solid rgba(255,255,255,.1);font-size:12px}.rarity-1{background:#e5e7eb;color:#111827}.rarity-2{background:#93c5fd;color:#0f172a}.rarity-3{background:#86efac;color:#052e16}.rarity-4{background:#fcd34d;color:#1f2937}.rarity-5{background:#fda4af;color:#3f0d12}.flower-tags{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-block;background:#0d1726;border:1px solid var(--line);color:var(--text);border-radius:999px;font-size:11px;padding:4px 8px;white-space:nowrap}.toggle-btn{width:100%;min-width:92px;background:#23314a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700}.toggle-btn.done{background:#1f6f4a;border-color:#2cc77a;color:#dffef1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 0}.stat{background:#101a2a;border:1px solid var(--line);border-radius:12px;padding:12px 10px}.stat-label{color:var(--muted);font-size:12px;margin-bottom:8px}.stat-value{font-size:1.8rem;font-weight:700}.green{color:var(--green)}.amber{color:var(--amber)}.need-panel{padding:14px 16px 16px}.need-table{margin-top:12px;background:#0f1727;border:1px solid var(--line);border-radius:12px;overflow:hidden}.need-table table{width:100%;border-collapse:collapse}.need-table th,.need-table td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}.empty{text-align:center;color:var(--green);padding:14px 10px;font-weight:700}@media (max-width:980px){.layout{grid-template-columns:1fr}.table-wrap{max-height:60vh}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-wrap">
        <h1>🌸 特殊花束配方管理</h1>
        <div class="subtitle">追蹤已完成 / 未完成花束，並自動統計還缺哪些花種與數量</div>
      </div>
      <div class="badge-mini">已預設完成：虎斑搖籃、奶貓搖鈴</div>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header"><strong>花束列表</strong></div>
        <div class="toolbar">
          <input id="searchInput" type="text" placeholder="搜尋花束名稱，例如：虎斑搖籃" />
          <div class="filter-group">
            <button data-filter="all">全部</button>
            <button data-filter="active" class="ghost">未完成</button>
            <button data-filter="done" class="ghost">已完成</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th style="width:70px;">編號</th><th style="width:185px;">花束名稱</th><th style="width:90px;">稀有度</th><th>配方</th><th style="width:120px;">狀態</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <div class="stat"><div class="stat-label">總花束</div><div class="stat-value" id="totalCount">0</div></div>
          <div class="stat"><div class="stat-label">已完成</div><div class="stat-value green" id="doneCount">0</div></div>
          <div class="stat"><div class="stat-label">未完成</div><div class="stat-value amber" id="remainCount">0</div></div>
        </div>
        <div class="need-panel">
          <strong>未完成花束總需求</strong>
          <div class="need-table">
            <table><thead><tr><th>花種</th><th style="width:80px;">數量</th></tr></thead><tbody id="needBody"></tbody></table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY='special-bouquet-tracker-v2';
    const bouquets=[
      { id: 1, name: '晨曦花語', rarity: 1, count: 3, flowers: ['白雛菊','白滿天星','白滿天星'], completed: false },
      { id: 2, name: '月下私語', rarity: 1, count: 3, flowers: ['白雛菊','白滿天星','綠萼梅'], completed: false },
      { id: 3, name: '微風輕拂', rarity: 1, count: 3, flowers: ['黃雛菊','白滿天星','玉蝶梅'], completed: false },
      { id: 4, name: '童話花園', rarity: 2, count: 3, flowers: ['黃雛菊','淡粉滿天星','龍游梅'], completed: false },
      { id: 5, name: '楓紅信箋', rarity: 3, count: 3, flowers: ['白雛菊','白滿天星','黑魔術玫瑰'], completed: false },
      { id: 6, name: '貓神的祝福', rarity: 4, count: 3, flowers: ['白雛菊','白滿天星','彩虹幻境玫瑰'], completed: false },
      { id: 7, name: '春日暖陽', rarity: 1, count: 3, flowers: ['黃雛菊','淺藍滿天星','朱砂梅'], completed: false },
      { id: 8, name: '星夜物語', rarity: 2, count: 3, flowers: ['白雛菊','淺藍滿天星','灑金梅'], completed: false },
      { id: 9, name: '銀河漫步', rarity: 2, count: 3, flowers: ['白雛菊','淺藍滿天星','照水梅'], completed: false },
      { id: 10, name: '珍珠雨露', rarity: 3, count: 3, flowers: ['白雛菊','淺藍滿天星','黑魔術玫瑰'], completed: false },
      { id: 11, name: '深夜癡戀', rarity: 4, count: 3, flowers: ['白雛菊','淺藍滿天星','彩虹幻境玫瑰'], completed: false },
      { id: 12, name: '甜蜜時光', rarity: 2, count: 3, flowers: ['白雛菊','胭脂紅滿天星','灑金梅'], completed: false },
      { id: 13, name: '霧中精靈', rarity: 3, count: 3, flowers: ['白雛菊','薰衣紫滿天星','照水梅'], completed: false },
      { id: 14, name: '流螢之光', rarity: 4, count: 3, flowers: ['黃雛菊','薰衣紫滿天星','黑魔術玫瑰'], completed: false },
      { id: 15, name: '紙箱祕境', rarity: 4, count: 3, flowers: ['白雛菊','胭脂紅滿天星','彩虹幻境玫瑰'], completed: false },
      { id: 16, name: '幸運草原', rarity: 3, count: 3, flowers: ['白雛菊','薄荷綠滿天星','龍游梅'], completed: false },
      { id: 17, name: '貓語呢喃', rarity: 4, count: 3, flowers: ['白雛菊','薄荷綠滿天星','黑魔術玫瑰'], completed: false },
      { id: 18, name: '耀雀盛宴', rarity: 5, count: 3, flowers: ['黃雛菊','雙色星斑滿天星','彩虹幻境玫瑰'], completed: false },
      { id: 19, name: '呼嚕小調', rarity: 4, count: 3, flowers: ['白雛菊','曜夜極黑薰衣草','黑魔術玫瑰'], completed: false },
      { id: 20, name: '飛雀散步', rarity: 5, count: 3, flowers: ['白雛菊','曜夜極黑薰衣草','彩虹幻境玫瑰'], completed: false },
      { id: 21, name: '雨後彩虹', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅'], completed: false },
      { id: 22, name: '午後小憩', rarity: 1, count: 4, flowers: ['白雛菊','白滿天星','白雪薰衣草','綠萼梅'], completed: false },
      { id: 23, name: '雪吻情書', rarity: 1, count: 4, flowers: ['白雛菊','白滿天星','白雪薰衣草','香檳玫瑰'], completed: false },
      { id: 24, name: '晚霞絮語', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','杏桃黃薰衣草','宮粉梅'], completed: false },
      { id: 25, name: '糖霜蛋糕', rarity: 2, count: 4, flowers: ['白雛菊','淡粉滿天星','白雪薰衣草','黑魔術玫瑰'], completed: false },
      { id: 26, name: '薩孔星空', rarity: 3, count: 4, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','璀璨極光百合'], completed: false },
      { id: 27, name: '金色年華', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','微光粉薰衣草','朱砂梅'], completed: false },
      { id: 28, name: '紫醉花香', rarity: 1, count: 4, flowers: ['白雛菊','淺藍滿天星','原生淺紫薰衣草','玉蝶梅'], completed: false },
      { id: 29, name: '祝福鈴聲', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','甜蜜藍薰衣草','橙黃玫瑰'], completed: false },
      { id: 30, name: '天使羽翼', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','曜夜極黑薰衣草','綠萼梅'], completed: false },
      { id: 31, name: '逗貓棒狂想', rarity: 3, count: 4, flowers: ['黃雛菊','淺藍滿天星','原生淺紫薰衣草','彩虹幻境玫瑰'], completed: false },
      { id: 32, name: '蜜糖派對', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','雙色斑紋薰衣草','香檳玫瑰'], completed: false },
      { id: 33, name: '奶油雲朵', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','杏桃黃薰衣草','玉蝶梅'], completed: false },
      { id: 34, name: '肉墊印記', rarity: 3, count: 4, flowers: ['白雛菊','胭脂紅滿天星','原生淺紫薰衣草','黑魔術玫瑰'], completed: false },
      { id: 35, name: '慵懶午後', rarity: 3, count: 4, flowers: ['黃雛菊','白滿天星','英倫深紫薰衣草','璀璨極光百合'], completed: false },
      { id: 36, name: '海風之戀', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','白雪薰衣草','白梅','白玫瑰'], completed: false },
      { id: 37, name: '琥珀之夢', rarity: 1, count: 5, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','朱砂梅','紅玫瑰'], completed: false },
      { id: 38, name: '緋色圓舞', rarity: 1, count: 5, flowers: ['白雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅','香水姬百合'], completed: false },
      { id: 39, name: '奶貓搖鈴', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','白雪薰衣草','白梅','橙黃玫瑰'], completed: true },
      { id: 40, name: '虎斑搖籃', rarity: 2, count: 5, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','紫葉紅梅','紅玫瑰'], completed: true },
      { id: 41, name: '蝴蝶結禮讚', rarity: 2, count: 5, flowers: ['白雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅','皇家金絲墨鬱金香'], completed: false },
      { id: 42, name: '青空之詩', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','甜蜜藍薰衣草','白梅','粉紅玫瑰'], completed: false },
      { id: 43, name: '玫瑰騎士', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','灑金梅','粉紅玫瑰'], completed: false },
      { id: 44, name: '闖蕩飯匠', rarity: 1, count: 5, flowers: ['黃雛菊','白滿天星','原生淺紫薰衣草','綠萼梅','虎斑雙色百合'], completed: false },
      { id: 45, name: '毛球慶典', rarity: 2, count: 5, flowers: ['白雛菊','白滿天星','微光粉薰衣草','白梅','幽藍幻影百合'], completed: false },
      { id: 46, name: '路路節奏', rarity: 3, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','琥珀冰晶梅','粉紅玫瑰'], completed: false },
      { id: 47, name: '寶石盒子', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','灑金梅','香檳金百合'], completed: false },
      { id: 48, name: '窗台日光浴', rarity: 1, count: 5, flowers: ['黃雛菊','白滿天星','英倫深紫薰衣草','白梅','橙黃玫瑰'], completed: false },
      { id: 49, name: '尾巴圓舞曲', rarity: 2, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','紫葉紅梅','紫玫瑰'], completed: false },
      { id: 50, name: '貓草花田', rarity: 3, count: 5, flowers: ['黃雛菊','白滿天星','原生淺紫薰衣草','玉蝶梅','皇家金絲墨鬱金香'], completed: false }
    ];

    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const doneMap={}; bouquets.forEach(item=>{ const key=String(item.id); doneMap[key]=Object.prototype.hasOwnProperty.call(saved,key)?!!saved[key]:!!item.completed; });
    const tbody=document.getElementById('tbody'); const needBody=document.getElementById('needBody'); const totalCount=document.getElementById('totalCount'); const doneCountEl=document.getElementById('doneCount'); const remainCountEl=document.getElementById('remainCount'); const searchInput=document.getElementById('searchInput'); let currentFilter='all';
    function saveState(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(doneMap)); }
    function getFiltered(){ const q=searchInput.value.trim().toLowerCase(); return bouquets.filter(item=>{ const matchText=!q||item.name.toLowerCase().includes(q); const matchDone=currentFilter==='all'||(currentFilter==='done'&&doneMap[item.id])||(currentFilter==='active'&&!doneMap[item.id]); return matchText&&matchDone; }); }
    function calcNeed(){ const needMap={}; let done=0; bouquets.forEach(item=>{ if(doneMap[item.id]){ done++; return; } item.flowers.forEach(f=>{ needMap[f]=(needMap[f]||0)+1; }); }); return { done, remain: bouquets.length-done, entries:Object.entries(needMap).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-Hant')) }; }
    function render(){ const filtered=getFiltered(); const rows=filtered.map(item=>{ const done=!!doneMap[item.id]; return `<tr class="${done?'done-row':''}"><td>${item.id}</td><td>${item.name}</td><td><span class="badge rarity-${item.rarity}">★ ${item.rarity}</span></td><td><div class="flower-tags">${item.flowers.map(f=>`<span class="tag">${f}</span>`).join('')}</div></td><td><button class="toggle-btn ${done?'done':''}" data-id="${item.id}">${done?'已完成 ✅':'未完成 ⏳'}</button></td></tr>`; }).join(''); tbody.innerHTML=rows||`<tr><td colspan="5" style="padding:20px; text-align:center;color:var(--muted);">沒有符合條件的花束</td></tr>`; document.querySelectorAll('.toggle-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=Number(btn.dataset.id); doneMap[id]=!doneMap[id]; saveState(); render(); }); }); const {done,remain,entries}=calcNeed(); totalCount.textContent=String(bouquets.length); doneCountEl.textContent=String(done); remainCountEl.textContent=String(remain); needBody.innerHTML=entries.length===0?`<tr><td colspan="2" class="empty">全部完成！</td></tr>`:entries.map(([name,count])=>`<tr><td>${name}</td><td>${count}</td></tr>`).join(''); }
    searchInput.addEventListener('input',render); document.querySelectorAll('[data-filter]').forEach(btn=>{ btn.addEventListener('click',()=>{ currentFilter=btn.dataset.filter; document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('ghost')); document.querySelectorAll('[data-filter]').forEach(b=>{ if(b.dataset.filter!==currentFilter) b.classList.add('ghost'); }); render(); }); }); render();
  </script>
</body>
</html>
