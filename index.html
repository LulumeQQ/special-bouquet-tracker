<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特殊花束配方追蹤器</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #374151;
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --chip: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1200px, 94vw);
      margin: 20px auto;
      display: grid;
      gap: 16px;
      grid-template-columns: 2fr 1fr;
    }

    @media (max-width: 980px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .card h1,
    .card h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .card-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }

    .card-body { padding: 14px 16px; }

    .muted { color: var(--muted); }

    .toolbar {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr auto auto;
      margin-bottom: 12px;
    }

    @media (max-width: 760px) {
      .toolbar { grid-template-columns: 1fr; }
    }

    input,
    select,
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 10px;
      font-size: 14px;
    }

    button { cursor: pointer; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      padding: 8px;
    }

    th {
      position: sticky;
      top: 0;
      background: #0b1220;
      z-index: 1;
    }

    .table-wrap {
      max-height: 68vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .flowers {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: var(--chip);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
    }

    .status-done { color: var(--ok); }
    .status-undone { color: var(--warn); }

    .row-done { opacity: 0.66; }

    .stats {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .danger { color: var(--danger); }
  </style>
</head>

      </div>

            <tbody id="bouquetBody"></tbody>

        </div>
      </div>

    const statusFilter = document.getElementById('statusFilter');
    const resetBtn = document.getElementById('resetBtn');

    let keyword = '';
    let filterStatus = 'all';

    function buildDefaultState() {
      const base = {};
      DEFAULT_COMPLETED_IDS.forEach((id) => { base[id] = true; });
      return base;
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return { ...buildDefaultState(), ...parsed };
      } catch (error) {
        return buildDefaultState();
      }
    }

    let completedMap = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(completedMap));
    }

    function flowersOf(bouquet) {
      return [bouquet.flower1, bouquet.flower2, bouquet.flower3, bouquet.flower4, bouquet.flower5].filter(Boolean);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function filteredBouquets() {
      return BOUQUETS.filter((b) => {
        const done = !!completedMap[b.id];
        if (filterStatus === 'completed' && !done) return false;
        if (filterStatus === 'incomplete' && done) return false;
        if (!keyword) return true;
        return b.name.includes(keyword);
      });
    }

    function toggleDone(id) {
      completedMap[id] = !completedMap[id];
      saveState();
      render();
    }

    function renderTable() {
      const rows = filteredBouquets().map((b) => {
        const done = !!completedMap[b.id];
        const flowers = flowersOf(b).map((f) => `<span class="chip">${escapeHtml(f)}</span>`).join('');
        return `
          <tr class="${done ? 'row-done' : ''}">
            <td>${b.id}</td>
            <td><strong>${escapeHtml(b.name)}</strong></td>
            <td>★${b.rarity}</td>
            <td>${b.price}</td>
            <td>${b.count}</td>
            <td><div class="flowers">${flowers}</div></td>
            <td>${escapeHtml(b.description)}</td>
            <td>
              <button type="button" data-id="${b.id}" class="toggle-btn ${done ? 'status-done' : 'status-undone'}">
                ${done ? '已完成' : '未完成'}
              </button>
            </td>
          </tr>
        `;
      }).join('');

      bouquetBody.innerHTML = rows || '<tr><td colspan="8" class="muted">沒有符合條件的花束</td></tr>';
      document.querySelectorAll('.toggle-btn').forEach((btn) => {
        btn.addEventListener('click', () => toggleDone(Number(btn.dataset.id)));
      });
    }

    function renderNeedSummary() {
      const needMap = {};
      let completedCount = 0;

      BOUQUETS.forEach((b) => {
        if (completedMap[b.id]) {
          completedCount += 1;
          return;
        }
        flowersOf(b).forEach((flower) => {
          needMap[flower] = (needMap[flower] || 0) + 1;
        });
      });

      const total = BOUQUETS.length;
      const incomplete = total - completedCount;
      const sortedNeeds = Object.entries(needMap).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hant'));
      const totalFlowerCount = sortedNeeds.reduce((sum, [, qty]) => sum + qty, 0);

      summaryEl.innerHTML = `
        <div>總花束：<strong>${total}</strong></div>
        <div class="status-done">已完成：<strong>${completedCount}</strong></div>
        <div class="status-undone">未完成：<strong>${incomplete}</strong></div>
        <div>未完成花材總數：<strong>${totalFlowerCount}</strong></div>
        <div class="muted">預設已完成示例：虎斑搖籃、奶貓搖鈴</div>
      `;

      needBody.innerHTML = sortedNeeds.map(([flower, qty]) => `
        <tr><td>${escapeHtml(flower)}</td><td>${qty}</td></tr>
      `).join('') || '<tr><td colspan="2" class="status-done">全部完成 🎉</td></tr>';
    }

    function render() {
      renderTable();
      renderNeedSummary();
    }

    searchInput.addEventListener('input', (event) => {
      keyword = event.target.value.trim();
      renderTable();
    });

    statusFilter.addEventListener('change', (event) => {
      filterStatus = event.target.value;
      renderTable();
    });

    resetBtn.addEventListener('click', () => {
      if (!window.confirm('確定要重設所有完成狀態嗎？')) return;
      completedMap = buildDefaultState();
      saveState();
      render();
    });

    render();
  </script>
</body>
</html>
