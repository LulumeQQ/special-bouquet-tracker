<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>特殊花束配方管理</title>
  <style>
    :root{--bg:#0c1220;--bg2:#121a2a;--panel:#1a2335;--line:#2c3a50;--text:#edf3ff;--muted:#a9b8d2;--green:#38d39f;--amber:#f6c453;--red:#ff6b6b;--shadow:0 18px 40px rgba(0,0,0,0.22)}
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif} body{min-height:100vh}.container{max-width:1440px;margin:24px auto;padding:0 18px 28px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.title-wrap h1{margin:0;font-size:clamp(1.6rem,2vw,2.4rem)}.subtitle{margin-top:6px;color:var(--muted);font-size:0.95rem}.badge-mini{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,0.03);color:var(--muted);font-size:0.8rem}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(350px,0.9fr);gap:18px}.panel{background:rgba(26,35,53,0.96);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.panel-header{padding:14px 18px;border-bottom:1px solid var(--line);font-size:1.05rem;background:rgba(255,255,255,0.02)}.toolbar{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;background:#0f1829;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px;outline:none}.toolbar input::placeholder{color:#7e8ea9}.filter-group{display:flex;gap:8px;flex-wrap:wrap}.filter-group button,.need-chip,.toggle-btn{border-radius:10px;border:1px solid var(--line);background:#111b2b;color:var(--text);padding:8px 14px;cursor:pointer;transition:.18s ease}.filter-group button.ghost,.need-chip{background:transparent}.filter-group button:hover,.need-chip:hover,.toggle-btn:hover{border-color:#4b5f82}.filter-group button.active,.need-chip.active,.toggle-btn.done{background:rgba(56,211,159,0.14);border-color:rgba(56,211,159,0.5);color:#bff7de}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse;min-width:820px}.table-wrap th,.table-wrap td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,0.06);vertical-align:top;text-align:left}.table-wrap th{color:var(--muted);font-weight:700;font-size:0.9rem;position:sticky;top:0;background:#1a2335;z-index:1}.flower-tags{display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-flex;align-items:center;justify-content:center;padding:5px 8px;background:#101a29;border:1px solid var(--line);border-radius:999px;font-size:0.78rem;color:var(--text)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:700;font-size:0.8rem}.rarity-1{background:rgba(99,139,255,0.14);color:#a8c1ff}.rarity-2{background:rgba(77,217,174,0.14);color:#b3f3d5}.rarity-3{background:rgba(246,196,83,0.14);color:#f9d981}.rarity-4{background:rgba(242,132,98,0.18);color:#ffbca0}.rarity-5{background:rgba(202,94,255,0.12);color:#e3b7ff}.done-row{background:rgba(56,211,159,0.03)}.toggle-btn{min-width:68px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:18px 18px 0;gap:12px}.stat{background:#111b2b;border:1px solid var(--line);border-radius:14px;padding:14px 12px}.stat-label{font-size:0.8rem;color:var(--muted);margin-bottom:8px}.stat-value{font-size:1.7rem;font-weight:800}.green{color:var(--green)}.amber{color:var(--amber)}.need-panel{padding:18px}.need-panel strong{display:block;margin-bottom:12px}.need-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.need-category{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#0f1829}.need-category-title{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:700}.need-category-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 12px}.need-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#101b2b;border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:8px 10px}.need-item-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.need-item-count{font-weight:800;color:var(--amber)}.empty{height:100%;display:flex;align-items:center;justify-content:center;padding:18px;color:var(--muted)}@media (max-width:980px){.layout{grid-template-columns:1fr}.need-category-items{grid-template-columns:1fr}}@media (max-width:560px){.stats{grid-template-columns:1fr}.toolbar{align-items:stretch}.toolbar input,.filter-group{width:100%}.filter-group{justify-content:flex-start}}  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-wrap">
        <h1>🌸 特殊花束配方管理</h1>
        <div class="subtitle">追蹤已完成 / 未完成花束，並自動統計還缺哪些花種與數量</div>
      </div>
      <div class="badge-mini">已預設完成：你指定的已完成花束</div>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header"><strong>花束列表</strong></div>
        <div class="toolbar">
          <input id="searchInput" type="text" placeholder="搜尋花束名稱，例如：虎斑搖籃" />
          <div class="filter-group">
            <button data-filter="all" class="active">全部</button>
            <button data-filter="active" class="ghost">未完成</button>
            <button data-filter="done" class="ghost">已完成</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:70px;">編號</th>
                <th style="width:185px;">花束名稱</th>
                <th style="width:90px;">稀有度</th>
                <th>配方</th>
                <th style="width:120px;">狀態</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="stats">
          <div class="stat"><div class="stat-label">總花束</div><div class="stat-value" id="totalCount">0</div></div>
          <div class="stat"><div class="stat-label">已完成</div><div class="stat-value green" id="doneCount">0</div></div>
          <div class="stat"><div class="stat-label">未完成</div><div class="stat-value amber" id="remainCount">0</div></div>
        </div>
        <div class="need-panel">
          <strong>未完成花束總需求</strong>
          <div id="needNav" class="need-nav"></div>
          <div class="need-table" id="needContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'special-bouquet-tracker-v2';
    const defaultCompletedNames = new Set([
      '晨曦花語','月下私語','童話花園','春日暖陽','星夜物語','銀河漫步','甜蜜時光','幸運草原','雨後彩虹','午後小憩','雪國情書','金色年華','祝福鈴聲','天使羽翼','貓草花田','瑰麗蝶舞','柔情曙光','青空之詩'
    ]);

    const bouquets = [
      { id: 1, name: '晨曦花語', rarity: 1, count: 3, flowers: ['白雛菊','白滿天星','白滿天星'] },
      { id: 2, name: '月下私語', rarity: 1, count: 3, flowers: ['白雛菊','白滿天星','綠萼梅'] },
      { id: 3, name: '微風輕拂', rarity: 1, count: 3, flowers: ['黃雛菊','白滿天星','玉蝶梅'] },
      { id: 4, name: '童話花園', rarity: 2, count: 3, flowers: ['黃雛菊','淡粉滿天星','龍游梅'] },
      { id: 5, name: '楓紅信箋', rarity: 3, count: 3, flowers: ['白雛菊','白滿天星','黑魔術玫瑰'] },
      { id: 6, name: '貓神的祝福', rarity: 4, count: 3, flowers: ['白雛菊','白滿天星','彩虹幻境玫瑰'] },
      { id: 7, name: '春日暖陽', rarity: 1, count: 3, flowers: ['黃雛菊','鵝黃滿天星','朱砂梅'] },
      { id: 8, name: '星夜物語', rarity: 2, count: 3, flowers: ['白雛菊','淺藍滿天星','灑金梅'] },
      { id: 9, name: '銀河漫步', rarity: 2, count: 3, flowers: ['白雛菊','淺藍滿天星','照水梅'] },
      { id: 10, name: '珍珠雨露', rarity: 3, count: 3, flowers: ['白雛菊','淺藍滿天星','黑魔術玫瑰'] },
      { id: 11, name: '深夜獵貓', rarity: 4, count: 3, flowers: ['白雛菊','淺藍滿天星','彩虹幻境玫瑰'] },
      { id: 12, name: '甜蜜時光', rarity: 2, count: 3, flowers: ['白雛菊','胭脂紅滿天星','灑金梅'] },
      { id: 13, name: '霧中精靈', rarity: 3, count: 3, flowers: ['白雛菊','薰衣紫滿天星','照水梅'] },
      { id: 14, name: '流螢之光', rarity: 4, count: 3, flowers: ['黃雛菊','薰衣紫滿天星','黑魔術玫瑰'] },
      { id: 15, name: '紙箱祕境', rarity: 4, count: 3, flowers: ['白雛菊','胭脂紅滿天星','彩虹幻境玫瑰'] },
      { id: 16, name: '幸運草原', rarity: 3, count: 3, flowers: ['白雛菊','薄荷綠滿天星','龍游梅'] },
      { id: 17, name: '貓語呢喃', rarity: 4, count: 3, flowers: ['白雛菊','薄荷綠滿天星','黑魔術玫瑰'] },
      { id: 18, name: '罐罐盛宴', rarity: 5, count: 3, flowers: ['黃雛菊','雙色星斑滿天星','彩虹幻境玫瑰'] },
      { id: 19, name: '呼嚕小調', rarity: 4, count: 3, flowers: ['白雛菊','曜夜極黑薰衣草','黑魔術玫瑰'] },
      { id: 20, name: '飛簷散步', rarity: 5, count: 3, flowers: ['白雛菊','曜夜極黑薰衣草','彩虹幻境玫瑰'] },
      { id: 21, name: '雨後彩虹', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅'] },
      { id: 22, name: '午後小憩', rarity: 1, count: 4, flowers: ['白雛菊','白滿天星','白雪薰衣草','綠萼梅'] },
      { id: 23, name: '雪國情書', rarity: 1, count: 4, flowers: ['白雛菊','白滿天星','白雪薰衣草','香檳玫瑰'] },
      { id: 24, name: '晚霞絮語', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','杏桃黃薰衣草','宮粉梅'] },
      { id: 25, name: '糖霜蛋糕', rarity: 2, count: 4, flowers: ['白雛菊','淡粉滿天星','白雪薰衣草','黑魔術玫瑰'] },
      { id: 26, name: '瞳孔星空', rarity: 3, count: 4, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','璀璨極光百合'] },
      { id: 27, name: '金色年華', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','微光粉薰衣草','朱砂梅'] },
      { id: 28, name: '紫醉花香', rarity: 1, count: 4, flowers: ['白雛菊','淺藍滿天星','原生淺紫薰衣草','玉蝶梅'] },
      { id: 29, name: '祝福鈴聲', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','甜蜜藍薰衣草','橙黃玫瑰'] },
      { id: 30, name: '天使羽翼', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','曜夜極黑薰衣草','綠萼梅'] },
      { id: 31, name: '逗貓棒狂想', rarity: 3, count: 4, flowers: ['黃雛菊','淺藍滿天星','原生淺紫薰衣草','彩虹幻境玫瑰'] },
      { id: 32, name: '蜜糖派對', rarity: 1, count: 4, flowers: ['黃雛菊','淡粉滿天星','雙色斑紋薰衣草','香檳玫瑰'] },
      { id: 33, name: '奶油雲朵', rarity: 2, count: 4, flowers: ['白雛菊','白滿天星','杏桃黃薰衣草','玉蝶梅'] },
      { id: 34, name: '肉墊印記', rarity: 3, count: 4, flowers: ['白雛菊','胭脂紅滿天星','原生淺紫薰衣草','黑魔術玫瑰'] },
      { id: 35, name: '慵懶午後', rarity: 3, count: 4, flowers: ['黃雛菊','白滿天星','英倫深紫薰衣草','璀璨極光百合'] },
      { id: 36, name: '海風之戀', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','白雪薰衣草','白梅','白玫瑰'] },
      { id: 37, name: '琥珀之夢', rarity: 1, count: 5, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','朱砂梅','紅玫瑰'] },
      { id: 38, name: '緋色圓舞', rarity: 1, count: 5, flowers: ['白雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅','香水姬百合'] },
      { id: 39, name: '奶貓搖鈴', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','白雪薰衣草','白梅','橙黃玫瑰'] },
      { id: 40, name: '虎斑搖籃', rarity: 2, count: 5, flowers: ['黃雛菊','淡粉滿天星','原生淺紫薰衣草','紫葉紅梅','紅玫瑰'] },
      { id: 41, name: '蝴蝶結禮讚', rarity: 2, count: 5, flowers: ['白雛菊','淡粉滿天星','原生淺紫薰衣草','宮粉梅','皇家金絲墨鬱金香'] },
      { id: 42, name: '青空之詩', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','甜蜜藍薰衣草','白梅','粉紅玫瑰'] },
      { id: 43, name: '玫瑰騎士', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','灑金梅','粉紅玫瑰'] },
      { id: 44, name: '鬍鬚微風', rarity: 1, count: 5, flowers: ['黃雛菊','白滿天星','原生淺紫薰衣草','綠萼梅','虎斑雙色百合'] },
      { id: 45, name: '毛球慶典', rarity: 2, count: 5, flowers: ['白雛菊','白滿天星','微光粉薰衣草','白梅','幽藍幻影百合'] },
      { id: 46, name: '踏踏節奏', rarity: 3, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','琥珀冰晶梅','粉紅玫瑰'] },
      { id: 47, name: '寶石盒子', rarity: 1, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','灑金梅','香檳金百合'] },
      { id: 48, name: '窗台日光浴', rarity: 1, count: 5, flowers: ['黃雛菊','白滿天星','英倫深紫薰衣草','白梅','橙黃玫瑰'] },
      { id: 49, name: '尾巴圓舞曲', rarity: 2, count: 5, flowers: ['白雛菊','白滿天星','原生淺紫薰衣草','紫葉紅梅','紫玫瑰'] },
      { id: 50, name: '貓草花田', rarity: 3, count: 5, flowers: ['黃雛菊','白滿天星','原生淺紫薰衣草','玉蝶梅','皇家金絲墨鬱金香'] }
    ].map(item => ({ ...item, completed: defaultCompletedNames.has(item.name) }));

    const flowerCategory = name => {
      if (name.includes('雛菊')) return '雛菊';
      if (name.includes('滿天星')) return '滿天星';
      if (name.includes('薰衣草')) return '薰衣草';
      if (name.includes('梅')) return '梅';
      if (name.includes('玫瑰')) return '玫瑰';
      if (name.includes('百合')) return '百合';
      return '鬱金香';
    };

    const slugify = name => name.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '');

    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const doneMap = {};
    bouquets.forEach(item => {
      const key = String(item.id);
      doneMap[key] = Object.prototype.hasOwnProperty.call(saved, key) ? !!saved[key] : !!item.completed;
    });

    const tbody = document.getElementById('tbody');
    const needContainer = document.getElementById('needContainer');
    const needNav = document.getElementById('needNav');
    const totalCount = document.getElementById('totalCount');
    const doneCountEl = document.getElementById('doneCount');
    const remainCountEl = document.getElementById('remainCount');
    const searchInput = document.getElementById('searchInput');
    let currentFilter = 'all';
    let currentCategory = 'all';

    const flowerCategories = ['all', '雛菊', '滿天星', '薰衣草', '梅', '玫瑰', '百合', '鬱金香'];

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(doneMap)); }
    function getFiltered() { const q = searchInput.value.trim().toLowerCase(); return bouquets.filter(item => { const matchText = !q || item.name.toLowerCase().includes(q); const matchDone = currentFilter === 'all' || (currentFilter === 'done' && doneMap[item.id]) || (currentFilter === 'active' && !doneMap[item.id]); return matchText && matchDone; }); }
    function calcNeed() { const needMap = {}; let done = 0; bouquets.forEach(item => { if (doneMap[item.id]) { done++; return; } item.flowers.forEach(f => { needMap[f] = (needMap[f] || 0) + 1; }); }); return { done, remain: bouquets.length - done, entries: needMap }; }

    function renderNeedTable() {
      const { entries } = calcNeed();
      if (Object.keys(entries).length === 0) {
        needNav.innerHTML = '';
        needContainer.innerHTML = '<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;">全部完成！</div>';
        return;
      }

      const grouped = {};
      Object.entries(entries).forEach(([name, count]) => {
        const cat = flowerCategory(name);
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push({ name, count });
      });

      const navEntries = flowerCategories.filter(cat => cat === 'all' || grouped[cat]);
      const navHtml = navEntries.map(cat => `<button class="need-chip ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat === 'all' ? '全部' : cat}</button>`).join('');
      needNav.innerHTML = navHtml;

      const renderCats = currentCategory === 'all' ? navEntries.filter(cat => cat !== 'all') : [currentCategory];
      let html = '';
      renderCats.forEach(cat => {
        html += `<div class="need-category" id="cat-${slugify(cat)}"><div class="need-category-title">${cat}</div><div class="need-category-items">`;
        grouped[cat].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-Hant')).forEach(item => {
          html += `<div class="need-item"><div class="need-item-name">${item.name}</div><div class="need-item-count">${item.count}</div></div>`;
        });
        html += `</div></div>`;
      });

      needContainer.innerHTML = html || '<div class="empty">無資料</div>';

      document.querySelectorAll('.need-chip').forEach(button => {
        button.addEventListener('click', () => {
          currentCategory = button.dataset.cat;
          renderNeedTable();
        });
      });
    }

    function render() {
      const filtered = getFiltered();
      const rows = filtered.map(item => {
        const done = !!doneMap[item.id];
        return `<tr class="${done ? 'done-row' : ''}">
          <td data-label="編號">${item.id}</td>
          <td data-label="花束名稱">${item.name}</td>
          <td data-label="稀有度"><span class="badge rarity-${item.rarity}">★ ${item.rarity}</span></td>
          <td data-label="配方"><div class="flower-tags">${item.flowers.map(f => `<span class="tag">${f}</span>`).join('')}</div></td>
          <td data-label="狀態"><button class="toggle-btn ${done ? 'done' : ''}" data-id="${item.id}">${done ? '完成' : '未完'}</button></td>
        </tr>`;
      }).join('');

      tbody.innerHTML = rows || `<tr><td colspan="5" style="padding:20px; text-align:center;color:var(--muted);">沒有符合條件的花束</td></tr>`;

      document.querySelectorAll('.toggle-btn').forEach(button => {
        button.addEventListener('click', () => {
          const id = Number(button.dataset.id);
          doneMap[id] = !doneMap[id];
          saveState();
          render();
        });
      });

      const { done, remain } = calcNeed();
      totalCount.textContent = String(bouquets.length);
      doneCountEl.textContent = String(done);
      remainCountEl.textContent = String(remain);
      renderNeedTable();
    }

    searchInput.addEventListener('input', render);
    document.querySelectorAll('[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('ghost'));
        document.querySelectorAll('[data-filter]').forEach(b => {
          if (b.dataset.filter !== currentFilter) b.classList.add('ghost');
        });
        document.querySelectorAll('[data-filter]').forEach(b => {
          if (b.dataset.filter === currentFilter) b.classList.add('active');
          else b.classList.remove('active');
        });
        render();
      });
    });

    render();
  </script>
</body>
</html>
